<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseWatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🚀 PulseWatch</h1>

    <h3>Real-Time Brand Sentiment Analysis</h3>

    <input
        type="text"
        id="brand"
        placeholder="Enter Brand Name">

    <textarea
        id="review"
        rows="6"
        placeholder="Enter Customer Review"></textarea>

    <button id="btn">
        Analyze Sentiment
    </button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
